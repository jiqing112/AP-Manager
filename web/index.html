                          <input id="wan-dns1" class="input mono" x-model="wanDlg.dns1" placeholder="223.5.5.5" autocomplete="off">
                        </div>
                        <div class="space-y-1.5">
                          <label class="label" for="wan-dns2">DNS 服务器 2 <span class="text-muted-foreground">（选填）</span></label>
                          <input id="wan-dns2" class="input mono" x-model="wanDlg.dns2" placeholder="119.29.29.29" autocomplete="off">
                        </div>
                      </div>
                      <p class="field-hint">静态 DNS 会同时下发给 LAN 侧客户端（在「互联网」页可见）。</p>
                    </div>
                  </template>
                  <!-- PPPoE -->
                  <template x-if="wanDlg.mode === 'pppoe'">
                    <div class="space-y-4">
                      <div class="alert alert-info">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-4 w-4 shrink-0 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        <span>PPPoE：使用运营商提供的宽带账号拨号，网口需直连光猫。拨通后自动接管默认路由，断线自动重拨。</span>
                      </div>
                      <div class="space-y-1.5">
                        <label class="label" for="wan-puser">宽带账号（用户名）</label>
                        <input id="wan-puser" class="input mono" x-model="wanDlg.puser" placeholder="ISP 提供的宽带账号" autocomplete="off">
                      </div>
                      <div class="space-y-1.5">
                        <label class="label" for="wan-ppass">宽带密码</label>
                        <div class="relative">
                          <input id="wan-ppass" class="input pr-12" :type="wanDlg.showPass ? 'text' : 'password'" x-model="wanDlg.ppass" autocomplete="new-password">
                          <button type="button" class="absolute inset-y-0 right-2 text-muted-foreground hover:text-foreground" @click="wanDlg.showPass = !wanDlg.showPass" :aria-label="wanDlg.showPass ? '隐藏密码' : '显示密码'">
                            <svg x-show="!wanDlg.showPass" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg x-show="wanDlg.showPass" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <p class="field-error" x-show="wanDlg.dlgErr" x-text="wanDlg.dlgErr"></p>
                  <div class="flex items-center justify-end gap-2 pt-2">
                    <p class="field-hint mr-auto">应用后有 3 分钟确认窗口，改坏会自动回滚</p>
                    <button type="button" class="btn btn-outline" @click="wanDlg.open = false">取消</button>
                    <button type="submit" class="btn btn-primary" :disabled="wanDlg.busy">
                      <span x-show="wanDlg.busy" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                      <span x-text="wanDlg.busy ? '应用中…' : '应用'"></span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </template>

          <!-- DNS 上游修改对话框 -->
          <template x-if="dnsDlg.open">
            <div>
              <div class="dialog-overlay" @click="dnsDlg.open = false"></div>
              <div class="dialog-panel max-w-md" role="dialog" aria-modal="true" aria-label="修改 DNS 服务器" @keydown.escape.window="dnsDlg.open = false">
                <h3 class="text-lg font-semibold">DNS 服务器</h3>
                <p class="mt-1 text-sm text-muted-foreground">LAN 客户端的解析请求按此转发上游</p>
                <form class="mt-4 space-y-3" @submit.prevent="saveDNS()">
                  <template x-for="(row, i) in dnsDlg.rows" :key="i">
                    <div class="flex items-center gap-2">
                      <span class="w-14 shrink-0 text-xs text-muted-foreground" x-text="'DNS ' + (i+1)"></span>
                      <input class="input mono flex-1" x-model="dnsDlg.rows[i]" :placeholder="i === 0 ? '223.5.5.5' : '选填'" autocomplete="off" spellcheck="false">
                      <button type="button" class="btn btn-ghost btn-sm text-destructive" @click="delDNSRow(i)" :aria-label="'删除 DNS ' + (i+1)" x-show="dnsDlg.rows.length > 1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                      </button>
                    </div>
                  </template>
                  <button type="button" class="btn btn-outline btn-sm" @click="addDNSRow()" x-show="dnsDlg.rows.length < 4">添加一行</button>
                  <p class="field-hint">清空所有行并保存 = 恢复自动获取（跟随上级网络）；修改会即时重启 dnsmasq 生效</p>
                  <p class="field-error" x-show="dnsDlg.err" x-text="dnsDlg.err"></p>
                  <div class="flex justify-end gap-2 pt-2">
                    <button type="button" class="btn btn-outline" @click="dnsDlg.open = false">取消</button>
                    <button type="submit" class="btn btn-primary" :disabled="dnsDlg.busy">
                      <span x-show="dnsDlg.busy" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                      <span x-text="dnsDlg.busy ? '保存中…' : '保存并生效'"></span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </template>
        </div>

        <!-- ========== 防火墙 ========== -->
        <div x-show="$store.app.page === 'firewall'" x-data="pageFirewall()" x-transition.opacity.duration.200ms class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 class="text-xl font-semibold tracking-tight">防火墙</h1>
              <p class="text-sm text-muted-foreground">端口转发 · 开放端口 · DMZ（WAN 侧入站规则）</p>
            </div>
            <div class="flex items-center gap-2">
              <span x-show="dirty() && !saving" class="badge badge-warning" x-cloak>有未保存的修改</span>
              <button class="btn btn-primary" @click="save()" :disabled="!dirty() || saving">
                <span x-show="saving" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                <span x-text="saving ? '应用中…' : '保存并生效'"></span>
              </button>
            </div>
          </div>

          <div class="alert alert-info">
            <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-4 w-4 shrink-0 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span>规则作用于 WAN 口入站方向；没有 WAN 口或未连接上行时规则暂不生效。保存后立即重写 nftables 表（只动 apmanager 自建表）。</span>
          </div>

          <!-- 端口转发 -->
          <div class="card">
            <div class="card-header flex-row items-center justify-between space-y-0">
              <div>
                <h3 class="card-title">端口转发</h3>
                <p class="card-desc">把 WAN 口的端口映射到内网设备（对外发布服务）</p>
              </div>
              <button class="btn btn-outline btn-sm" @click="addPF()">添加规则</button>
            </div>
            <div class="card-content p-0">
              <template x-if="loaded && pf.length === 0">
                <div class="empty">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-muted-foreground/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                  <p class="text-sm text-muted-foreground">还没有端口转发规则</p>
                  <p class="text-xs text-muted-foreground">例如把 WAN 8080 转发到内网 NAS 的 80 端口</p>
                </div>
              </template>
              <div class="overflow-x-auto" x-show="pf.length > 0">
                <table class="tbl">
                  <thead><tr><th>名称</th><th>协议</th><th>WAN 端口</th><th class="hidden sm:table-cell"></th><th>目标</th><th>状态</th><th class="text-right">操作</th></tr></thead>
                  <tbody>
                    <template x-for="(r, i) in pf" :key="i">
                      <tr :class="!r.enabled && 'opacity-50'">
                        <td class="font-medium" x-text="r.name || '规则 ' + (i+1)"></td>
                        <td><span class="badge badge-outline" x-text="protoLabel(r.proto)"></span></td>
                        <td class="mono tabular-nums" x-text="r.wanPort"></td>
                        <td class="hidden sm:table-cell text-muted-foreground">→</td>
                        <td class="mono" x-text="r.destIP + ':' + r.destPort"></td>
                        <td>
                          <button class="badge cursor-pointer" :class="r.enabled ? 'badge-success' : 'badge-outline'" @click="r.enabled = !r.enabled" x-text="r.enabled ? '启用' : '停用'"></button>
                        </td>
                        <td class="text-right">
                          <div class="flex justify-end gap-1">
                            <button class="btn btn-ghost btn-sm" title="编辑" @click="editPF(r)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                            <button class="btn btn-ghost btn-sm text-destructive" title="删除" @click="delPF(i)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- UPnP -->
          <div class="card">
            <div class="card-header flex-row items-center justify-between space-y-0">
              <div>
                <h3 class="card-title">UPnP / NAT-PMP</h3>
                <p class="card-desc">让游戏机、BT 客户端等内网设备自动打洞，改善 NAT 类型</p>
              </div>
              <button type="button" role="switch" :aria-checked="upnp.enabled" class="switch" :class="upnp.enabled ? 'switch-on' : 'switch-off'" @click="toggleUpnp()">
                <span class="switch-thumb"></span>
              </button>
            </div>
            <div class="card-content">
              <template x-if="!upnp.installed">
                <div class="alert alert-warning">
                  <span>miniupnpd 未安装。请先执行：<code class="mono">sudo apt install miniupnpd</code>，然后重启服务生效。</span>
                </div>
              </template>
              <template x-if="upnp.installed">
                <div class="flex items-center gap-2 text-sm">
                  <span class="dot" :class="upnp.running && upnp.enabled ? 'dot-ok' : 'dot-off'"></span>
                  <span x-text="upnp.enabled ? (upnp.running ? 'miniupnpd 运行中，内网设备可自动申请端口映射' : '已启用，等待网络面下发启动') : '已关闭'"></span>
                  <span class="ml-auto text-xs text-muted-foreground">使用独立 nftables 表，与本面板规则互不干扰</span>
                </div>
              </template>
              <p class="field-hint mt-2" x-show="upnp.enabled">安全提示：secure_mode 开启，映射只允许指向发起请求的内网设备；跟随上行口变化自动重建。</p>
            </div>
          </div>

          <div class="grid gap-4 lg:grid-cols-2">
            <!-- 开放端口 -->
            <div class="card">
              <div class="card-header flex-row items-center justify-between space-y-0">
                <div>
                  <h3 class="card-title">开放端口</h3>
                  <p class="card-desc">放行 WAN 侧访问本机端口</p>
                </div>
                <button class="btn btn-outline btn-sm" @click="addOP()">添加</button>
              </div>
              <div class="card-content p-0">
                <template x-if="loaded && op.length === 0">
                  <div class="empty py-6">
                    <p class="text-sm text-muted-foreground">没有放行任何 WAN 侧端口</p>
                  </div>
                </template>
                <div class="space-y-2 p-4" x-show="op.length > 0">
                  <template x-for="(r, i) in op" :key="i">
                    <div class="flex items-center justify-between rounded-md border px-3 py-2" :class="!r.enabled && 'opacity-50'">
                      <div class="flex items-center gap-2">
                        <span class="font-medium" x-text="r.name || '端口 ' + r.port"></span>
                        <span class="badge badge-outline" x-text="protoLabel(r.proto)"></span>
                        <span class="mono tabular-nums text-sm" x-text="r.port"></span>
                      </div>
                      <div class="flex items-center gap-1">
                        <button class="badge cursor-pointer" :class="r.enabled ? 'badge-success' : 'badge-outline'" @click="r.enabled = !r.enabled" x-text="r.enabled ? '启用' : '停用'"></button>
                        <button class="btn btn-ghost btn-sm" title="编辑" @click="editOP(r)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                        <button class="btn btn-ghost btn-sm text-destructive" title="删除" @click="delOP(i)"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- DMZ -->
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">DMZ 主机</h3>
                <p class="card-desc">WAN 全端口转发到内网一台机器（游戏联机/NAT 类型严苛时用）</p>
              </div>
              <div class="card-content space-y-4">
                <div class="flex h-[38px] items-center justify-between rounded-md border px-3 transition-colors" :class="dmz.enabled ? 'border-warning/40 bg-warning/5' : ''">
                  <span class="text-sm">启用 DMZ</span>
                  <button type="button" role="switch" :aria-checked="dmz.enabled" class="switch" :class="dmz.enabled ? 'switch-on' : 'switch-off'" @click="dmz.enabled = !dmz.enabled">
                    <span class="switch-thumb"></span>
                  </button>
                </div>
                <div class="space-y-1.5">
                  <label class="label" for="dmz-ip">DMZ 主机 IP</label>
                  <input id="dmz-ip" class="input mono" x-model="dmz.ip" placeholder="192.168.50.100" :disabled="!dmz.enabled"
                         :class="dmz.enabled && dmz.ip && !isValidIP(dmz.ip) && 'border-destructive'">
                  <p class="field-error" x-show="dmz.enabled && dmz.ip && !isValidIP(dmz.ip)">不是合法的 IPv4 地址</p>
                  <p class="field-hint">该主机将暴露在 WAN 侧，请确保其自身防火墙可靠</p>
                </div>
              </div>
            </div>
          </div>

          <!-- 规则编辑对话框（端口转发/开放端口共用） -->
          <template x-if="dlg && dlg.kind">
            <div>
              <div class="dialog-overlay" @click="dlg = { kind: '' }"></div>
              <div class="dialog-panel max-w-md" role="dialog" aria-modal="true" @keydown.escape.window="dlg = { kind: '' }">
                <h3 class="text-lg font-semibold" x-text="dlg.kind === 'pf' ? (dlg.idx >= 0 ? '编辑端口转发' : '添加端口转发') : (dlg.idx >= 0 ? '编辑开放端口' : '添加开放端口')"></h3>
                <form class="mt-4 space-y-4" @submit.prevent="saveDlg()">
                  <div class="space-y-1.5">
                    <label class="label" for="dlg-name">名称 <span class="text-muted-foreground">（选填）</span></label>
                    <input id="dlg-name" class="input" x-model="dlg.name" maxlength="32" :placeholder="dlg.kind === 'pf' ? '如：NAS 网页' : '如：WireGuard'">
                  </div>
                  <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                      <label class="label" for="dlg-proto">协议</label>
                      <select id="dlg-proto" class="input" x-model="dlg.proto">
                        <option value="tcp">TCP</option>
                        <option value="udp">UDP</option>
                        <option value="tcpudp">TCP + UDP</option>
                      </select>
                    </div>
                    <div class="space-y-1.5" x-show="dlg.kind === 'pf'">
                      <label class="label" for="dlg-wanport">WAN 端口</label>
                      <input id="dlg-wanport" class="input" type="number" min="1" max="65535" x-model="dlg.wanPort" placeholder="8080">
                    </div>
                    <div class="space-y-1.5" x-show="dlg.kind === 'op'">
                      <label class="label" for="dlg-port">本机端口</label>
                      <input id="dlg-port" class="input" type="number" min="1" max="65535" x-model="dlg.port" placeholder="51820">
                    </div>
                  </div>
                  <template x-if="dlg.kind === 'pf'">
                    <div class="grid grid-cols-2 gap-4">
                      <div class="space-y-1.5">
                        <label class="label" for="dlg-destip">目标 IP</label>
                        <input id="dlg-destip" class="input mono" x-model="dlg.destIP" placeholder="192.168.50.10">
                      </div>
                      <div class="space-y-1.5">
                        <label class="label" for="dlg-destport">目标端口</label>
                        <input id="dlg-destport" class="input" type="number" min="1" max="65535" x-model="dlg.destPort" placeholder="80">
                      </div>
                    </div>
                  </template>
                  <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" class="h-4 w-4 accent-[hsl(var(--primary))]" x-model="dlg.enabled"> 立即启用
                  </label>
                  <p class="field-error" x-show="dlgErr" x-text="dlgErr"></p>
                  <div class="flex justify-end gap-2 pt-2">
                    <button type="button" class="btn btn-outline" @click="dlg = { kind: '' }">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                  </div>
                </form>
              </div>
            </div>
          </template>
        </div>

        <!-- ========== 网络诊断 ========== -->
        <div x-show="$store.app.page === 'diag'" x-data="pageDiag()" x-transition.opacity.duration.200ms class="space-y-5">
          <div>
            <h1 class="text-xl font-semibold tracking-tight">网络诊断</h1>
            <p class="text-sm text-muted-foreground">从路由器本机探测网络（结果与电脑本机不同）</p>
          </div>

          <div class="card">
            <div class="card-content space-y-4">
              <!-- 工具选择 -->
              <div class="flex flex-wrap gap-2" role="tablist" aria-label="诊断工具">
                <template x-for="t in tools" :key="t.id">
                  <button class="btn btn-sm" :class="tool === t.id ? 'btn-primary' : 'btn-outline'" @click="setTool(t.id)" role="tab" :aria-selected="tool === t.id" x-text="t.label"></button>
                </template>
              </div>
              <!-- 目标输入 -->
              <form class="flex flex-col gap-2 sm:flex-row" @submit.prevent="run()">
                <input id="diag-target" class="input flex-1" x-model="target" :placeholder="'目标，' + (tools.find(t => t.id === tool)?.hint || '')" autocomplete="off" spellcheck="false">
                <button type="submit" class="btn btn-primary sm:w-28" :disabled="running || !target.trim()">
                  <span x-show="running" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                  <span x-text="running ? '探测中…' : '开始探测'"></span>
                </button>
              </form>
              <!-- 快捷目标 -->
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs text-muted-foreground">常用：</span>
                <template x-for="p in presets" :key="p">
                  <button class="badge badge-outline cursor-pointer hover:border-primary/40" @click="target = p" x-text="p"></button>
                </template>
              </div>
            </div>
          </div>

          <!-- 输出终端 -->
          <div class="card">
            <div class="card-header flex-row items-center justify-between space-y-0">
              <h3 class="card-title flex items-center gap-2">
                <span x-text="(tools.find(t => t.id === tool) || {}).label"></span>
                <span class="mono text-sm font-normal text-muted-foreground" x-text="target"></span>
              </h3>
              <button class="btn btn-ghost btn-sm" x-show="output && !running" @click="output = ''; runErr = ''">清空</button>
            </div>
            <div class="card-content">
              <div x-show="runErr && !output" class="alert alert-destructive"><span x-text="runErr"></span></div>
              <pre class="terminal" x-show="output" x-text="output"></pre>
              <!-- 空态：终端始终在场，紧凑指引 -->
              <div x-show="!output && !running" class="terminal">
                <div class="grid gap-x-8 gap-y-3 sm:grid-cols-2">
                  <div class="flex items-start gap-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
                    <div><p class="font-medium">Ping</p><p class="t-dim">测试到目标的连通性与延迟</p></div>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>
                    <div><p class="font-medium">路由跟踪</p><p class="t-dim">逐跳查看路径，定位断点</p></div>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                    <div><p class="font-medium">DNS 解析</p><p class="t-dim">验证域名能否解析出 IP</p></div>
                  </div>
                  <div class="flex items-start gap-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 10v4M10 10v4M14 10v4M18 10v4"/></svg>
                    <div><p class="font-medium">端口测试</p><p class="t-dim">探测目标的 TCP 端口是否开放</p></div>
                  </div>
                </div>
                <p class="t-dim mt-4 border-t pt-3">// 就绪。选择上方工具，输入目标后「开始探测」。</p>
              </div>
              <div x-show="!output && running" class="terminal"><p class="t-dim">探测中，最长约 15 秒…</p></div>
            </div>
          </div>
        </div>

        <!-- ========== 系统 ========== -->
        <div x-show="$store.app.page === 'system'" x-data="pageSystem()" x-transition.opacity.duration.200ms class="space-y-5">
          <div>
            <h1 class="text-xl font-semibold tracking-tight">系统</h1>
            <p class="text-sm text-muted-foreground">主机资源与安全设置</p>
          </div>
          <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <div class="card p-4"><span class="text-xs font-medium text-muted-foreground">CPU</span><div class="stat-num mt-1" x-text="($store.live.system.cpuPercent ?? 0).toFixed(0) + '%'"></div><div class="mt-1 text-xs text-muted-foreground" x-text="'负载 ' + ($store.live.system.load1 ?? 0).toFixed(2) + ' / ' + ($store.live.system.load5 ?? 0).toFixed(2)"></div></div>
            <div class="card p-4"><span class="text-xs font-medium text-muted-foreground">内存</span><div class="stat-num mt-1" x-text="memPct() + '%'"></div><div class="mt-1 text-xs text-muted-foreground" x-text="($store.live.system.memUsedMB ?? 0) + ' / ' + ($store.live.system.memTotalMB ?? 0) + ' MB'"></div></div>
            <div class="card p-4"><span class="text-xs font-medium text-muted-foreground">温度</span><div class="stat-num mt-1" x-text="($store.live.system.tempC ?? 0).toFixed(0) + '°C'"></div><div class="mt-1 text-xs text-muted-foreground" x-text="($store.live.system.tempC > 75 ? '偏高' : '正常')"></div></div>
            <div class="card p-4"><span class="text-xs font-medium text-muted-foreground">运行时长</span><div class="stat-num mt-1" x-text="fmtDur($store.live.system.uptimeSec)"></div><div class="mt-1 text-xs text-muted-foreground" x-text="'磁盘 ' + ($store.live.system.diskUsedMB ?? 0) + '/' + ($store.live.system.diskTotalMB ?? 0) + 'MB'"></div></div>
          </div>

          <!-- 系统操作 -->
          <div class="card">
            <div class="card-header flex-row items-center justify-between space-y-0">
              <div>
                <h3 class="card-title">系统操作</h3>
                <p class="card-desc">路由器时间 <span class="tabular-nums" x-text="routerTime()"></span></p>
              </div>
              <button class="btn btn-destructive" @click="confirmReboot = true" :disabled="rebooting">
                <span x-show="rebooting" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                <span x-text="rebooting ? '重启中…' : '重启设备'"></span>
              </button>
            </div>
            <div class="card-content space-y-4">
              <p class="text-sm text-muted-foreground">重启会中断所有连接约 1–2 分钟；网络拓扑由配置自动恢复（AP 自启、防火墙规则重新下发）。</p>
              <div class="flex flex-wrap items-center gap-3 border-t pt-4">
                <span class="text-sm font-medium">定时重启</span>
                <input type="time" class="input w-32" x-model="sched.rebootAt" aria-label="每日定时重启时间">
                <button class="btn btn-outline btn-sm" @click="sched.rebootAt = ''" x-show="sched.rebootAt" x-cloak>禁用</button>
                <button class="btn btn-primary btn-sm" @click="saveSchedule()" :disabled="schedBusy">
                  <span x-show="schedBusy" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                  <span x-text="sched.rebootAt ? ('每天 ' + (sched.rebootAt || '') + ' 重启') : '保存'"></span>
                </button>
                <span class="text-xs text-muted-foreground">设备长期运行的例行维护（GL.iNet「定时任务」同款）</span>
              </div>
            </div>
          </div>

          <!-- 修改密码 -->
          <form class="card" @submit.prevent="changePw()">
            <div class="card-header"><h3 class="card-title">修改管理密码</h3><p class="card-desc">修改后所有已登录会话失效（含当前）</p></div>
            <div class="card-content grid gap-4 sm:grid-cols-2">
              <div class="space-y-1.5"><label class="label">当前密码</label><input type="password" class="input" x-model="pw.old" required autocomplete="current-password"></div>
              <div class="space-y-1.5"><label class="label">新密码</label><input type="password" class="input" x-model="pw.new" required minlength="8" maxlength="63" autocomplete="new-password"><p class="field-hint">8–63 位</p></div>
            </div>
            <div class="card-footer justify-end gap-2">
              <p class="field-error mr-auto" x-show="pwErr" x-text="pwErr"></p>
              <button type="submit" class="btn btn-primary" :disabled="pwBusy">
                <span x-show="pwBusy" class="h-4 w-4 animate-spin" x-html="spinner()"></span>修改密码
              </button>
            </div>
          </form>

          <!-- 进程状态 -->
          <div class="card">
            <div class="card-header"><h3 class="card-title">托管进程</h3><p class="card-desc">hostapd / dnsmasq 等</p></div>
            <div class="card-content">
              <template x-if="(procs() || []).length === 0">
                <p class="text-sm text-muted-foreground">暂无托管进程运行</p>
              </template>
              <div class="space-y-2">
                <template x-for="p in procs() || []" :key="p.name">
                  <div class="flex items-center justify-between rounded-md border px-3 py-2">
                    <span class="font-medium mono text-sm" x-text="p.name"></span>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-muted-foreground" x-text="'重启 ' + (p.starts || 0) + ' 次'"></span>
                      <span class="badge" :class="{running:'badge-success', starting:'badge-warning', backoff:'badge-warning', failed:'badge-destructive', stopped:'badge-outline'}[p.state]" x-text="({running:'运行中', starting:'启动中', backoff:'退避重启', failed:'故障', stopped:'已停止'})[p.state]"></span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <!-- ========== 日志 ========== -->
        <div x-show="$store.app.page === 'logs'" x-data="pageLogs()" x-transition.opacity.duration.200ms class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 class="text-xl font-semibold tracking-tight">日志</h1>
              <p class="text-sm text-muted-foreground">最近 500 条应用日志</p>
            </div>
            <div class="flex gap-2">
              <select class="input w-32" x-model="level" @change="load()">
                <option value="">全部级别</option>
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARN">WARN</option>
                <option value="ERROR">ERROR</option>
              </select>
              <button class="btn btn-outline" @click="paused = !paused" x-text="paused ? '继续滚动' : '暂停滚动'"></button>
              <button class="btn btn-outline" @click="load()">刷新</button>
            </div>
          </div>
          <div class="card">
            <div class="card-content">
              <template x-if="loading"><div class="space-y-2"><div class="skeleton h-4 w-full"></div><div class="skeleton h-4 w-4/5"></div><div class="skeleton h-4 w-3/5"></div></div></template>
              <template x-if="!loading && loadErr">
                <div class="empty">
                  <p class="text-sm text-destructive" x-text="'日志加载失败：' + loadErr"></p>
                  <button class="btn btn-outline btn-sm mt-2" @click="load()">重试</button>
                </div>
              </template>
              <template x-if="!loading && !loadErr && items.length === 0">
                <p class="py-8 text-center text-sm text-muted-foreground">无匹配日志</p>
              </template>
              <div class="max-h-[60vh] space-y-1 overflow-y-auto" x-ref="box">
                <template x-for="(l, i) in items" :key="i">
                  <div class="logline" :class="l.line.includes('level=ERROR') ? 'text-destructive' : (l.line.includes('level=WARN') ? 'text-warning' : '')" x-text="l.line"></div>
                </template>
              </div>
            </div>
          </div>

          <!-- 子进程诊断面板 -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">子进程诊断</h3>
              <p class="card-desc">hostapd / dnsmasq / wpa_supplicant 的最近输出（启动失败先看这里）</p>
            </div>
            <div class="card-content space-y-3">
              <template x-if="diag.length === 0">
                <p class="text-sm text-muted-foreground">暂无托管进程</p>
              </template>
              <template x-for="p in diag" :key="p.name">
                <details class="rounded-md border">
                  <summary class="flex cursor-pointer items-center justify-between px-3 py-2 text-sm">
                    <span class="flex items-center gap-2">
                      <span class="dot" :class="{running:'dot-ok',starting:'dot-warn',backoff:'dot-warn',failed:'dot-err',stopped:'dot-off'}[p.state]"></span>
                      <span class="mono font-medium" x-text="p.name"></span>
                    </span>
                    <span class="text-xs text-muted-foreground" x-text="({running:'运行中',starting:'启动中',backoff:'退避重启',failed:'故障',stopped:'已停止'})[p.state] + ' · 重启 ' + (p.starts || 0) + ' 次'"></span>
                  </summary>
                  <div class="border-t px-3 py-2">
                    <template x-if="!p.log || p.log.length === 0">
                      <p class="text-xs text-muted-foreground">（无输出）</p>
                    </template>
                    <div x-show="p.log && p.log.length" class="max-h-48 space-y-0.5 overflow-y-auto">
                      <template x-for="(l, i) in (p.log || [])" :key="i">
                        <div class="logline" x-text="l"></div>
                      </template>
                    </div>
                    <p x-show="p.lastErr" class="logline text-destructive" x-text="'最近错误: ' + p.lastErr"></p>
                  </div>
                </details>
              </template>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>
  </template>

  <!-- 会话校验中的过场（深链刷新未登录时短暂显示，避免空白） -->
  <div x-show="$store.app.page !== 'login' && !$store.app.authed" class="fixed inset-0 z-40 flex flex-col items-center justify-center gap-3 bg-background text-muted-foreground">
    <svg class="h-6 w-6 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"/></svg>
    <span class="text-sm">正在验证会话…</span>
  </div>

  <!-- 移动端抽屉 -->
  <div x-show="$store.app.drawer" x-transition.opacity class="dialog-overlay md:hidden" @click="$store.app.drawer = false"></div>
  <div x-show="$store.app.drawer" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full"
       class="fixed inset-y-0 left-0 z-50 w-64 border-r bg-card p-3 md:hidden">
    <div class="mb-2 flex items-center justify-between px-2 py-1">
      <span class="font-semibold">AP Manager</span>
      <button class="btn btn-ghost btn-sm" @click="$store.app.drawer = false" aria-label="关闭菜单">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <nav class="space-y-0.5">
      <template x-for="item in $store.app.nav" :key="item.id || ('g-' + item.group)">
        <div>
          <div x-show="item.group" class="nav-group-label" x-text="item.group"></div>
          <a x-show="item.id" :href="'#/' + item.id" class="nav-link" :class="$store.app.page === item.id && 'nav-link-active'" @click="$store.app.drawer = false">
            <span x-html="$store.app.navIcon(item.icon)" class="h-4 w-4 shrink-0"></span>
            <span x-text="item.label"></span>
          </a>
        </div>
      </template>
    </nav>
  </div>

  <!-- 网络模式切换模态框（GL.iNet 式四选一） -->
  <template x-if="$store.app.modeDlg.open">
    <div>
      <div class="dialog-overlay" @click="$store.app.modeDlg.open = false"></div>
      <div class="dialog-panel max-w-lg" role="dialog" aria-modal="true" aria-label="网络模式" @keydown.escape.window="$store.app.modeDlg.open = false">
        <h3 class="text-lg font-semibold">网络模式</h3>
        <template x-if="$store.app.modeDlg.loading">
          <div class="mt-6 space-y-2"><div class="skeleton h-14 w-full"></div><div class="skeleton h-14 w-full"></div><div class="skeleton h-14 w-full"></div><div class="skeleton h-14 w-full"></div></div>
        </template>
        <template x-if="!$store.app.modeDlg.loading">
          <div>
            <div class="alert alert-info mt-3 text-xs leading-relaxed">
              <span>如果改变网络模式，你必须重新连接你的客户端设备。如果改变 AP 模式 / 无线扩展模式，你可能无法访问这个界面。你可以通过按住设备的重置按钮 4 秒来将设备恢复到路由模式。</span>
            </div>
            <div class="mt-4 space-y-2.5" role="radiogroup" aria-label="选择网络模式">
              <!-- 路由模式 -->
              <button type="button" class="flex w-full items-start gap-3 rounded-lg border p-4 text-left transition-colors"
                      :class="$store.app.modeDlg.sel === 'router' ? 'border-primary bg-primary/5 ring-1 ring-primary/30' : 'hover:border-muted-foreground/30'"
                      @click="$store.app.modeDlg.sel = 'router'" role="radio" :aria-checked="$store.app.modeDlg.sel === 'router'">
                <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border" :class="$store.app.modeDlg.sel === 'router' ? 'border-primary' : 'border-muted-foreground/40'">
                  <span class="h-2 w-2 rounded-full" :class="$store.app.modeDlg.sel === 'router' ? 'bg-primary' : 'bg-transparent'"></span>
                </span>
                <span>
                  <span class="block text-sm font-medium">路由模式</span>
                  <span class="mt-0.5 block text-xs text-muted-foreground">创建您自己的私有网络。本机将充当 NAT、防火墙和 DHCP 服务器。</span>
                </span>
              </button>
              <!-- AP 模式 -->
              <button type="button" class="flex w-full items-start gap-3 rounded-lg border p-4 text-left transition-colors"
                      :class="$store.app.modeDlg.sel === 'ap' ? 'border-primary bg-primary/5 ring-1 ring-primary/30' : 'hover:border-muted-foreground/30'"
                      @click="$store.app.modeDlg.sel = 'ap'" role="radio" :aria-checked="$store.app.modeDlg.sel === 'ap'">
                <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border" :class="$store.app.modeDlg.sel === 'ap' ? 'border-primary' : 'border-muted-foreground/40'">
                  <span class="h-2 w-2 rounded-full" :class="$store.app.modeDlg.sel === 'ap' ? 'bg-primary' : 'bg-transparent'"></span>
                </span>
                <span>
                  <span class="block text-sm font-medium">AP 模式</span>
                  <span class="mt-0.5 block text-xs text-muted-foreground">通过有线连接到上级网络并扩展无线网络（不路由，由上级分配地址）。</span>
                </span>
              </button>
              <!-- 无线扩展模式 -->
              <button type="button" class="flex w-full items-start gap-3 rounded-lg border p-4 text-left transition-colors"
                      :class="$store.app.modeDlg.sel === 'wisp' ? 'border-primary bg-primary/5 ring-1 ring-primary/30' : 'hover:border-muted-foreground/30'"
                      @click="$store.app.modeDlg.sel = 'wisp'" role="radio" :aria-checked="$store.app.modeDlg.sel === 'wisp'">
                <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border" :class="$store.app.modeDlg.sel === 'wisp' ? 'border-primary' : 'border-muted-foreground/40'">
                  <span class="h-2 w-2 rounded-full" :class="$store.app.modeDlg.sel === 'wisp' ? 'bg-primary' : 'bg-transparent'"></span>
                </span>
                <span>
                  <span class="block text-sm font-medium">无线扩展模式</span>
                  <span class="mt-0.5 block text-xs text-muted-foreground">扩展现有无线网络的 Wi-Fi 覆盖范围（中继上游做上行）。</span>
                </span>
              </button>
              <!-- WDS 模式（不支持） -->
              <div class="flex w-full cursor-not-allowed items-start gap-3 rounded-lg border border-dashed p-4 text-left opacity-60" role="radio" aria-checked="false" aria-disabled="true" title="暂未实现">
                <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border border-muted-foreground/40">
                  <span class="h-2 w-2 rounded-full bg-transparent"></span>
                </span>
                <span>
                  <span class="block text-sm font-medium">WDS 模式</span>
                  <span class="mt-0.5 block text-xs text-muted-foreground">与 Extender 类似，需要上级路由器支持 WDS——本面板暂未实现，请使用「无线扩展模式」。</span>
                </span>
              </div>
            </div>
            <p class="field-error mt-3" x-show="$store.app.modeDlg.err" x-text="$store.app.modeDlg.err"></p>
            <!-- 应用后的 60s 确认窗口（模态框内完成，任何页面发起都可见） -->
            <template x-if="$store.app.modeDlg.pendingId">
              <div class="mt-4 rounded-lg border border-warning/40 bg-warning/10 p-4">
                <div class="flex items-center gap-2 text-sm font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                  已应用，等待确认——<span class="tabular-nums" x-text="$store.app.modeCountdown() + 's'"></span> 内未确认将自动回滚
                </div>
                <p class="mt-1 text-xs text-muted-foreground">网络正常就点确认；失联了什么都不用做，倒计时结束自动恢复。</p>
                <div class="mt-3 flex gap-2">
                  <button class="btn btn-primary btn-sm" @click="$store.app.confirmNetMode()">确认保留</button>
                  <button class="btn btn-outline btn-sm" @click="$store.app.rollbackNetMode()">撤销回滚</button>
                </div>
              </div>
            </template>
            <div class="mt-5 flex items-center justify-center gap-2" x-show="!$store.app.modeDlg.pendingId">
              <p class="field-hint mr-auto">应用后有 3 分钟确认窗口，改坏会自动回滚</p>
              <button class="btn btn-primary px-8" @click="$store.app.applyNetMode()" :disabled="$store.app.modeDlg.busy">
                <span x-show="$store.app.modeDlg.busy" class="h-4 w-4 animate-spin" x-html="spinner()"></span>
                <span x-text="$store.app.modeDlg.busy ? '应用中…' : '应用'"></span>
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Toast 容器 -->
  <div class="pointer-events-none fixed bottom-4 right-4 z-[60] flex flex-col gap-2">
    <template x-for="t in $store.app.toasts" :key="t.id">
      <div class="toast" role="status">
        <span class="mt-0.5 h-2 w-2 shrink-0 rounded-full" :class="{'bg-success': t.type === 'success', 'bg-destructive': t.type === 'error', 'bg-primary': t.type === 'info'}"></span>
        <div class="flex-1 text-sm" x-text="t.msg"></div>
        <button class="text-muted-foreground hover:text-foreground" @click="$store.app.dismissToast(t.id)" aria-label="关闭">×</button>
      </div>
    </template>
  </div>

  <script>/* 全局助手在 app.js 中定义 */</script>
</body>
</html>
